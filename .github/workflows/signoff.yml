name: klt signoff

# The block's tier state is graded, not hand-read: re-render the tier-verdict
# report from the committed block manifest (manifests/asap7-stdcells.json) and
# byte-compare it against the committed verdict of record
# (manifests/asap7-stdcells.signoff.json). Whoever changes cited evidence, the
# manifest or the vendored checklist must regenerate the record in the same PR.
#
# The evidence map is empty today, so every item grades unmet (exit 3). That is
# the honest steady state, not a failure.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install klayout-tools==0.7.0

      - name: Lint committed evidence JSON
        run: |
          set -uo pipefail
          # No evidence is committed yet; an empty set must pass.
          mapfile -t files < <(find layout verification sim -name '*.json' -type f 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No committed evidence JSON under layout/ verification/ sim/ - nothing to lint."
            exit 0
          fi
          klt env-provenance lint-envelope "${files[@]}"

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/asap7-stdcells.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # 0 = every T1 item met; 3 = grader ran, some item unmet. Both are
          # valid runs. Anything else is a hard error.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/asap7-stdcells.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/asap7-stdcells.signoff.json."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/asap7-stdcells.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/asap7-stdcells.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/asap7-stdcells.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."
