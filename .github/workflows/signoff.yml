name: klt signoff

# The block's tier state is graded, not hand-read: re-render the tier-verdict
# report from the committed block manifest (manifests/asap7-stdcells.json) and
# byte-compare it against the committed verdict of record
# (manifests/asap7-stdcells.signoff.json). Whoever changes cited evidence, the
# manifest or the vendored checklist must regenerate the record in the same PR.
#
# Items 9 and 10 cite tool-produced attestation envelopes (klt signoff
# --attest); the remaining items have no evidence yet and grade unmet, so the
# grader exits 3. That is the honest steady state, not a failure.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install klayout-tools==0.8.0

      - name: Install KLayout (klt DRC runs the system klayout binary)
        run: |
          set -uo pipefail
          # klt drc shells out to `klayout -b`; the pip install of klt does
          # not provide it. The committed envelopes were produced with the
          # Ubuntu 24.04 package, which is what ubuntu-latest installs.
          sudo apt-get update -qq
          sudo apt-get install -y -qq klayout
          command -v -a klayout
          klayout -v

      - name: Lint committed evidence JSON
        run: |
          set -uo pipefail
          # No evidence is committed yet; an empty set must pass.
          mapfile -t files < <(find layout verification sim -name '*.json' -type f 2>/dev/null | sort)
          # Skip records listed in verification/records/SUPERSEDED.txt (kept
          # byte-for-byte, replaced by a later record; see that file).
          if [ -f verification/records/SUPERSEDED.txt ]; then
            while read -r old _; do
              case "$old" in ''|'#'*) continue;; esac
              kept=()
              for f in "${files[@]}"; do
                case "$f" in verification/records/"$old"/*) ;; *) kept+=("$f");; esac
              done
              files=("${kept[@]}")
            done < verification/records/SUPERSEDED.txt
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No committed evidence JSON under layout/ verification/ sim/ - nothing to lint."
            exit 0
          fi
          # --allow-prefix: klt writes its own packaged ASAP7 deck path into
          # every DRC envelope as an absolute path. That tool-install prefix
          # (the uv tool venv the records were run in) is the only prefix
          # allowed; the checkout/worktree prefix is never allowed, so layout
          # paths stay repo-relative (operator ruling, issue #14).
          klt env-provenance lint-envelope \
              --allow-prefix /home/ubuntu/.local/share/uv/tools/klayout-tools \
              "${files[@]}"

      - name: Item 9 cold start, output visible (diagnostic)
        run: |
          set -uo pipefail
          # klt --attest records only a check's exit status, so a failing
          # cold start shows no stderr. Run the same command here so a runner
          # failure is diagnosable. Same command as the attested cold_start
          # check; it is not a substitute for it.
          rm -rf verification/records/.attest-coldstart
          python3 verification/run_regression.py --fetch-pdk \
              --only INVx1_ASAP7_75t_R --record-id .attest-coldstart
          rc=$?
          rm -rf verification/records/.attest-coldstart verification/.work
          exit $rc

      - name: Re-attest T1 items 9 and 10 against the committed envelopes
        run: |
          set -uo pipefail
          # --check re-attests and exits 0 only if the inventory, every
          # inventoried file and every check outcome still reproduce the
          # committed envelope. Item 9's cold start fetches the pinned PDK.
          for item in 9 10; do
            klt signoff --attest "$item" \
                --inventory "manifests/t1-item${item}-inventory.json" \
                --check "manifests/t1-item${item}.envelope.json" || {
              echo "::error::T1 item ${item} attestation drifted from manifests/t1-item${item}.envelope.json. Refresh:"
              echo "  klt signoff --attest ${item} --inventory manifests/t1-item${item}-inventory.json -o manifests/t1-item${item}.envelope.json"
              exit 1
            }
          done

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/asap7-stdcells.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # 0 = every T1 item met; 3 = grader ran, some item unmet. Both are
          # valid runs. Anything else is a hard error.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/asap7-stdcells.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/asap7-stdcells.signoff.json."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/asap7-stdcells.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/asap7-stdcells.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/asap7-stdcells.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."
