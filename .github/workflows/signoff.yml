name: klt signoff

# The block's tier state is graded, not hand-read: re-render the tier-verdict
# report from the committed block manifest (manifests/asap7-stdcells.json) and
# byte-compare it against the committed verdict of record
# (manifests/asap7-stdcells.signoff.json). Whoever changes cited evidence, the
# manifest or the vendored checklist must regenerate the record in the same PR.
#
# Items 1, 2, 9 and 10 cite tool-produced attestation envelopes (klt signoff
# --attest); item 4 cites the library `klt lvs` envelope of a verification
# record, pinned by the layout stream's content hash. The steady state is
# grader exit 0 with the block at T1 (tier T1, t1_met_count 10 as of
# 2026-11-15), so the re-grade step accepts exit 0 only and exit 3 -- a T1
# item unmet -- is a hard error. The tolerance is deliberately strict: the
# pinned grader (klayout-tools==0.9.0) grades T1 items only, so a future
# tier-2 item cannot make a legitimate PR exit 3 under this pin. A
# klayout-tools repin must re-check the grader's exit semantics and the
# tier-floor literals in verification/check_tier_floor.py (T1 / 10) in the
# same PR that changes the pin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install klayout-tools==0.9.0

      - name: Repo self-tests (verification/**/test_*.py)
        run: |
          set -uo pipefail
          # Exit 0 = every discovered suite ran and passed; 1 = a suite failed;
          # 3 = a suite could not run because its interpreter is missing. klt is
          # installed in the step above, so 3 means CI itself is broken, not
          # that the suites are fine -- a check that cannot run must not look
          # like one that passed (.loom/docs/ci-principles.md). A bare run:
          # fails the job on both, which is the intended behaviour: do not
          # special-case 3.
          python3 verification/run_selftests.py

      - name: Install KLayout (klt DRC runs the system klayout binary)
        run: |
          set -uo pipefail
          # klt drc shells out to `klayout -b`; the pip install of klt does
          # not provide it. The committed envelopes were produced with the
          # Ubuntu 24.04 package, the package version ubuntu-latest installs may differ (logged below).
          sudo apt-get update -qq
          sudo apt-get install -y -qq klayout
          type -a klayout
          klayout -v

      - name: Lint committed evidence JSON
        run: |
          set -uo pipefail
          # No evidence is committed yet; an empty set must pass.
          mapfile -t files < <(find layout verification sim -name '*.json' -type f 2>/dev/null | sort)
          # Skip records listed in verification/records/SUPERSEDED.txt (kept
          # byte-for-byte, replaced by a later record; see that file).
          if [ -f verification/records/SUPERSEDED.txt ]; then
            while read -r old _; do
              case "$old" in ''|'#'*) continue;; esac
              kept=()
              for f in "${files[@]}"; do
                case "$f" in verification/records/"$old"/*) ;; *) kept+=("$f");; esac
              done
              files=("${kept[@]}")
            done < verification/records/SUPERSEDED.txt
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No committed evidence JSON under layout/ verification/ sim/ - nothing to lint."
            exit 0
          fi
          # --allow-prefix: klt writes its own packaged ASAP7 deck path into
          # every DRC envelope as an absolute path. That tool-install prefix
          # (the uv tool venv the records were run in) is the only prefix
          # allowed; the checkout/worktree prefix is never allowed, so layout
          # paths stay repo-relative (operator ruling, issue #14).
          # /opt/pdk is the Spot batch worker's own PDK install prefix, which
          # the remote envelope records at
          # environment.remote.worker_environment.pdk.root for batch-sim
          # records (decision 0011). Like the tool venv it is a fleet-wide
          # constant, not a checkout path, so it is allowed as a prefix only;
          # the committed reports are left untouched (append-only evidence).
          klt env-provenance lint-envelope \
              --allow-prefix /home/ubuntu/.local/share/uv/tools/klayout-tools \
              --allow-prefix /opt/pdk \
              "${files[@]}"

      - name: Item 9 cold start, output visible (diagnostic)
        run: |
          set -uo pipefail
          # klt --attest records only a check's exit status, so a failing
          # cold start shows no stderr. Run the same command here so a runner
          # failure is diagnosable. Same command as the attested cold_start
          # check; it is not a substitute for it.
          rm -rf verification/records/.attest-coldstart
          python3 verification/run_regression.py --fetch-pdk \
              --only INVx1_ASAP7_75t_R --record-id .attest-coldstart
          rc=$?
          rm -rf verification/records/.attest-coldstart verification/.work
          exit $rc

      - name: GDS freshness negative control
        run: |
          set -uo pipefail
          # The redraw check (attested under item 2) must flag a flipped byte,
          # a missing GDS, a missing script and a failing script; if any broken
          # copy passes, the check could silently never fire.
          python3 -I design/check_gds_fresh_negctl.py

      - name: CDL freshness negative control
        run: |
          set -uo pipefail
          # The CDL/draw-script pairing (attested under item 1) must flag a
          # changed CDL, a changed script, a CDL with no entry, an entry whose
          # file is gone and a draw script the pair does not record; and must
          # stay quiet on the device-less cells recorded with a null CDL hash
          # without treating that null as a wildcard. If any broken copy
          # passes, the check could silently never fire.
          python3 -I design/check_cdl_fresh_negctl.py

      - name: Tier floor negative control
        run: |
          set -uo pipefail
          # The tier floor (asserted after the re-grade below) must flag the
          # tier=null / t1_met_count=8 shapes measured on PR #153, a wrong
          # tier, a missing key, unparseable JSON and a missing record; and
          # must stay quiet on an unmodified record. If any broken copy
          # passes, the floor could silently never fire.
          python3 -I verification/check_tier_floor_negctl.py

      - name: Re-attest T1 item 2 against the committed envelope
        run: |
          set -uo pipefail
          # Item 2 attests the committed library stream; its inventory declares
          # the check that redraws every cell's GDS from its draw script.
          klt signoff --attest 2 \
              --input verification/library/A7S_75t_R_LIBRARY.gds \
              --inventory manifests/t1-item2-inventory.json \
              --check manifests/t1-item2.envelope.json || {
            echo "::error::T1 item 2 attestation drifted from manifests/t1-item2.envelope.json. Refresh:"
            echo "  klt signoff --attest 2 --input verification/library/A7S_75t_R_LIBRARY.gds --inventory manifests/t1-item2-inventory.json -o manifests/t1-item2.envelope.json"
            exit 1
          }

      - name: Re-attest T1 items 1, 9 and 10 against the committed envelopes
        run: |
          set -uo pipefail
          # --check re-attests and exits 0 only if the inventory, every
          # inventoried file and every check outcome still reproduce the
          # committed envelope. Item 1 runs the CDL freshness and switch-level
          # function checks; item 9's cold start fetches the pinned PDK.
          for item in 1 9 10; do
            klt signoff --attest "$item" \
                --inventory "manifests/t1-item${item}-inventory.json" \
                --check "manifests/t1-item${item}.envelope.json" || {
              echo "::error::T1 item ${item} attestation drifted from manifests/t1-item${item}.envelope.json. Refresh:"
              echo "  klt signoff --attest ${item} --inventory manifests/t1-item${item}-inventory.json -o manifests/t1-item${item}.envelope.json"
              exit 1
            }
          done

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/asap7-stdcells.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # 0 = every T1 item met. Anything else is a hard error: exit 3
          # means a T1 item is unmet. The pinned grader grades T1 items
          # only, so exit 3 is never a legitimate tier-2 state (see the
          # file header).
          if [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff exited $rc (expected 0): a T1 item is unmet, or the manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/asap7-stdcells.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/asap7-stdcells.signoff.json."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/asap7-stdcells.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/asap7-stdcells.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/asap7-stdcells.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."

      - name: Tier floor on the committed record
        run: |
          set -uo pipefail
          # PAIR with the step above: this floor covers the fresh render only
          # because that step's cmp proved fresh == committed. Do not remove
          # the cmp and keep this step -- doing so silently narrows the floor
          # to whatever was last committed.
          python3 -I verification/check_tier_floor.py \
              manifests/asap7-stdcells.signoff.json

  # The signoff job above runs run_regression.py with --only (a single-cell
  # cold start), and run_regression.py skips run_merged, run_library and the
  # family_coverage assertion under --only. This job runs the full-library pass
  # so a red result in any of them fails the check. Separate job: the full pass
  # measured 25 min 15 s locally (klt 0.9.0, 28 cells), over the 15 min budget
  # of the job above. The checkout is its own, so the library stream the pass
  # regenerates cannot touch what T1 item 2 attests in the job above.
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install klayout-tools==0.9.0

      - name: Install KLayout (klt DRC runs the system klayout binary)
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq klayout
          klayout -v

      - name: Families-without-control gate negative control
        run: |
          set -uo pipefail
          # A pass with every V3 control removed must exit 1 and name V3 as the
          # family without a control; if it passes, the gate could silently
          # never fire. --fetch-pdk: on a fresh runner verification/.pdk does
          # not exist, and this step runs before the full-library step that
          # also fetches the PDK.
          python3 -I verification/check_family_gate_negctl.py --fetch-pdk

      - name: Full-library regression (merged stream, library LVS, family coverage, LEF)
        run: |
          set -uo pipefail
          # No --only: run_merged, run_library and family_coverage execute.
          rm -rf verification/records/.ci-fullpass
          python3 verification/run_regression.py --fetch-pdk --record-id .ci-fullpass
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::full-library run_regression.py exited $rc"
            exit 1
          fi

      - name: Regenerated library stream matches the committed copy
        run: |
          set -uo pipefail
          # run_library rewrites verification/library/*.{gds,cdl}; they must be
          # byte-identical to the committed files (what T1 item 2 attests).
          if ! git diff --exit-code --stat -- verification/library; then
            echo "::error::the full pass regenerated verification/library differently from the committed copy; a cell changed without the library being refreshed"
            exit 1
          fi
